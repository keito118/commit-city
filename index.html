<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>commit-city</title>
    <meta name="description" content="Turn any GitHub repository into a 3D city." />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="city"></div>

    <header class="panel" id="controls">
      <h1>commit-city</h1>
      <form id="repo-form">
        <input id="repo-input" name="repo" placeholder="owner/repo or GitHub URL" autocomplete="off" spellcheck="false" />
        <button type="submit">Build</button>
      </form>
      <div class="row">
        <label>Theme <select id="theme-select"></select></label>
        <label>Ground
          <select id="ground-select">
            <option value="sqrt">Size (balanced)</option>
            <option value="linear">Size (exact share)</option>
          </select>
        </label>
        <label class="file-button">Open snapshot <input id="file-input" type="file" accept=".json,application/json" hidden /></label>
      </div>
      <details>
        <summary>GitHub token (optional)</summary>
        <p>Without a token, heights come from the latest 25 commits. A token reads up to 400 and opens private repositories. It is kept only in this browser.</p>
        <input id="token-input" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false" />
      </details>
      <div class="row">
        <span class="examples">Try: <a href="?repo=vitejs/vite">vite</a> · <a href="?repo=mrdoob/three.js">three.js</a> · <a href="?repo=expressjs/express">express</a></span>
      </div>
      <p id="status" role="status"></p>
    </header>

    <aside class="panel" id="info" hidden></aside>
    <aside class="panel" id="legend"></aside>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
